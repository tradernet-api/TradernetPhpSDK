name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: json, openssl

      - uses: ramsey/composer-install@v3

      - name: PHPUnit
        run: composer test

      - name: PHPStan
        run: composer stan

      - name: PHP-CS-Fixer
        run: composer cs
